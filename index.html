<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central Tino</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #ffffff;
      text-align: center;
    }
    header {
      padding: 60px 20px;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }
    p {
      color: #bbbbbb;
      max-width: 600px;
      margin: 0 auto 30px;
    }
    .links a {
      display: inline-block;
      margin: 10px;
      padding: 12px 24px;
      border: 1px solid #ffffff;
      color: #ffffff;
      text-decoration: none;
      border-radius: 25px;
    }
    .links a:hover {
      background: #ffffff;
      color: #000000;
    }
    footer {
      margin-top: 60px;
      padding: 20px;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>

  <header>
    <h1>Central Tino</h1>
    <p>
      Artist | Dreaming of a better life I never got to see.
    </p>

    <div class="links">
      <a href="#">Spotify</a>
      <a href="#">YouTube</a>
      <a href="#">Instagram</a>
      <a href="#">Contact</a>
    </div>
  </header>

  <footer>
    © 2026 Central Tino
  </footer>

</body>
</html>
